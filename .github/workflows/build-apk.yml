name: Build APK

# An APK cannot be produced on the phone: aapt2 is published only as an x86-64
# Linux binary. The runner compiles Kotlin/Java and packages; it never executes
# the arm64 payload, it only verifies and stages it.
#
# The three runtime tarballs are committed in the repo (android/app/assets).
# Only Kimi Code itself is fetched at build time: it is 170 MB and would break
# GitHub's per-file limit, and downloading it lets us pin a sha256.
on:
  workflow_dispatch:
    inputs:
      kimi_version:
        description: Kimi Code version to bundle
        default: "0.42.0"
        required: false
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'kimi_agent/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'requirements-runtime.txt'

permissions:
  contents: read

env:
  KIMI_VERSION: ${{ github.event.inputs.kimi_version || '0.42.0' }}
  # From the install manifest; the build fails rather than bundle an unverified binary.
  KIMI_SHA256: 4fa0d6f7a5171733d9391b074ebfe318e81a7ee83af6c648d51c42834961cc5a

jobs:
  kimi-binary:
    name: Fetch Kimi Code
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify (linux-arm64)
        run: |
          set -euo pipefail
          url="https://cdn.kimi.com/kimi-code/binaries/${KIMI_VERSION}/kimi-code-linux-arm64"
          echo "GET $url"
          curl -fL --retry 5 --retry-delay 3 -o /tmp/kimi "$url"
          echo "${KIMI_SHA256}  /tmp/kimi" | sha256sum -c -
          # Cross-compiled: this runner is x86-64, so the binary is only copied.
          file /tmp/kimi
          du -h /tmp/kimi
          mkdir -p /tmp/out && mv /tmp/kimi /tmp/out/libkimi.so

      # A single-file artifact: upload-artifact v4 strips the common leading
      # directory of multi-path uploads, so a staging path like
      # android/app/jniLibs/... would silently arrive somewhere else. The build
      # job locates it by name instead of assuming a layout.
      - uses: actions/upload-artifact@v4
        with:
          name: libkimi
          path: /tmp/out/libkimi.so
          retention-days: 7

  payload:
    name: Validate runtime payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed payload
        run: |
          set -euo pipefail
          for f in rootfs.tar.gz.bin deps.tar.gz.bin app.tar.gz.bin; do
            p="android/app/assets/$f"
            test -s "$p" || { echo "missing $p — run scripts/package_payload.sh"; exit 1; }
            tar -tzf "$p" > "/tmp/$f.txt" || { echo "$p is not a readable tar.gz"; exit 1; }
            grep -q . "/tmp/$f.txt" || { echo "$p is empty"; exit 1; }
            echo "$f $(du -h "$p" | cut -f1) ($(wc -l < "/tmp/$f.txt") entries)"
          done
          tar -tzf android/app/assets/app.tar.gz.bin  > /tmp/app.txt
          tar -tzf android/app/assets/deps.tar.gz.bin > /tmp/deps.txt
          grep -q 'kimi_agent/cli.py'   /tmp/app.txt
          # Bootstrap expands each archive directly into its destination, so a
          # self-prefix breaks it: the first build packed "deps/" inside
          # deps.tar.gz.bin, the libraries landed in root/deps/deps and the
          # device died on "missing after unpack: __init__.py". Assert the
          # anchored path and simulate the expansion for all three archives.
          grep -q '^\./aiohttp/__init__\.py$' /tmp/deps.txt
          for a in rootfs deps app; do
            d=$(mktemp -d)
            tar -xzf "android/app/assets/$a.tar.gz.bin" -C "$d"
            echo "$a unpacks to: $(ls "$d" | head -5 | tr '\n' ' ')"
            test -e "$d/deps" && { echo "$a has a self-prefix again"; exit 1; }
            rm -rf "$d"
          done
          # Pinned by RuntimeSpec.requiredFiles(): an archive that lost either
          # would unpack into a runtime that cannot start.
          grep -q '^\./usr/bin/python3\.12$'      /tmp/rootfs.tar.gz.bin.txt
          grep -q '^\./usr/lib/aarch64-linux-gnu/ld-linux-aarch64\.so\.1$' /tmp/rootfs.tar.gz.bin.txt
          test -s android/app/jniLibs/arm64-v8a/libproot.so

      - name: Agent tests
        run: |
          python -m pip install --quiet -r requirements.txt
          COOMI_KIMI_HOME=$(mktemp -d) python -m pytest tests -q

  build:
    name: Build APK
    needs: [kimi-binary, payload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libkimi
          path: /tmp/kimi-artifact

      - name: Stage Kimi Code as a jniLib
        run: |
          set -euo pipefail
          src=$(find /tmp/kimi-artifact -name libkimi.so | head -1)
          test -n "$src" || { echo "artifact did not contain libkimi.so"; exit 1; }
          echo "${KIMI_SHA256}  $src" | sha256sum -c -
          mkdir -p android/app/jniLibs/arm64-v8a
          install -m 644 "$src" android/app/jniLibs/arm64-v8a/libkimi.so
          du -h android/app/jniLibs/arm64-v8a/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Kotlin unit tests (guest command line + tar reader)
        working-directory: android
        run: |
          chmod +x ../gradlew
          ../gradlew --no-daemon -p . :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ../gradlew --no-daemon -p . :app:assembleDebug

      - name: Assert the APK really contains the runtime
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk" || { echo "no APK produced"; exit 1; }
          echo "APK $apk $(du -h "$apk" | cut -f1)"
          # -Z1 prints names only; `unzip -l` columns are awkward to match and
          # hid the real entry layout the first time this check misfired.
          unzip -Z1 "$apk" > /tmp/apk.txt
          echo "--- asset and native entries ---"
          grep -E '^(assets/|lib/)' /tmp/apk.txt || { echo "APK has no assets/ or lib/ entries at all"; cat /tmp/apk.txt | head -30; exit 1; }
          echo "--- dex ---"
          grep -c '^classes.*\.dex$' /tmp/apk.txt
          for want in assets/rootfs.tar.gz.bin assets/deps.tar.gz.bin assets/app.tar.gz.bin \
                      lib/arm64-v8a/libproot.so lib/arm64-v8a/libkimi.so; do
            grep -qx "$want" /tmp/apk.txt || { echo "missing $want"; exit 1; }
          done
          # Names alone were not enough once: aapt2 gunzips a ".gz" asset and
          # renames it, so the APK held a valid-looking "rootfs.tar" that
          # Bootstrap's GZIPInputStream could never read. Check the magic bytes
          # and the stored size of each payload instead of trusting the name.
          for a in rootfs deps app; do
            entry="assets/$a.tar.gz.bin"
            magic=$(unzip -p "$apk" "$entry" | head -c2 | od -An -tx1 | tr -d ' \n')
            packed=$(unzip -p "$apk" "$entry" | wc -c)
            echo "$entry magic=$magic bytes=$packed"
            [ "$magic" = "1f8b" ] || { echo "$entry is not gzip (aapt2 decompressed it)"; exit 1; }
            src=$(stat -c %s "android/app/assets/$a.tar.gz.bin")
            [ "$packed" = "$src" ] || { echo "$entry changed size: $packed vs $src"; exit 1; }
          done
          grep -Eq '^classes.*\.dex$' /tmp/apk.txt || { echo "missing classes.dex"; exit 1; }
          grep -qx 'AndroidManifest.xml' /tmp/apk.txt || { echo "missing manifest"; exit 1; }
          echo "runtime complete inside the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: coomi-kimi-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
